name: Build profile SVGs

on:
  schedule:
    # 03:00 UTC — midday in Japan, so the graph reflects the previous day fully.
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/build-profile.yml'

permissions:
  contents: write

# A scheduled run and a push run committing at once would collide.
concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci` on purpose: the generators import only Node builtins and the
      # committed data/*.json. opentype.js is needed solely by build:kana, which
      # runs by hand when the word pool gains a new character. Nothing to install
      # means nothing to break here.
      - name: Generate cards and snake
        env:
          # A PAT with read:user is preferred: the Actions-issued GITHUB_TOKEN
          # frequently cannot read contributionsCollection, which would leave the
          # graph empty. The script falls back to GITHUB_TOKEN when PROFILE_TOKEN
          # is absent, and fails loudly in CI rather than shipping sample data.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          node scripts/generate-cards.mjs
          node scripts/generate-snake.mjs

      - name: Commit updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh profile SVGs [skip ci]'
          file_pattern: 'dist/*.svg'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
