<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="200" viewBox="0 0 440 200" role="img" aria-labelledby="title desc">
<title id="title">Most used languages for Rudy-Ong</title>
<desc id="desc">Python 59.5%, Jupyter Notebook 13.9%, JavaScript 13.2%, TypeScript 7.4%, CSS 3.8%, HTML 2.2%</desc>
<style>
    .card-bg { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; }
    .muted { fill: #59636e; }
    .value { fill: #1f2328; }
    .accent { fill: #0969da; }
    .item { opacity: 0; animation: rise 0.5s ease-out forwards; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {.item { opacity: 1; animation: none; }}
    
    .bar-track { fill: #ebedf0; }
    .seg { transform-origin: left center; transform: scaleX(0); animation: grow 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {.seg { transform: none; animation: none; }}
  
  </style>
<defs><clipPath id="barclip"><rect x="20" y="62" width="400" height="14" rx="6" fill="#fff"/></clipPath></defs>
